.letter {
  position: absolute; top: 5%; left: 10%; width: 78%; height: 70%;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 500; font-size: calc(var(--keycap-size) * 0.427); color: var(--letter);
  user-select: none; pointer-events: none; line-height: 1; z-index: 2;
  text-shadow:
    0 calc(1px * var(--emboss)) calc(1px * var(--emboss)) rgba(0,0,0,calc(0.45 * var(--emboss))),
    0 calc(2px * var(--emboss)) calc(3px * var(--emboss)) rgba(0,0,0,calc(0.25 * var(--emboss))),
    0 calc(-1px * var(--emboss)) 0 rgba(255,255,255,calc(0.35 * var(--emboss)));
}
.keycap-clip.period .letter { font-size: calc(var(--keycap-size) * 0.47); }
@keyframes singlePress {
  0% { transform: translateY(0); }
  50% { transform: translateY(var(--press-depth)); }
  100% { transform: translateY(0); }
}
.keycap.pressing { animation: singlePress var(--press-time) ease-in-out; }
.demo-bg {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}
</style>
</head>
<body>
<div class="demo-bg">
  <div class="logo" id="logo">
    <div class="keycap-clip" style="--i:0"><div class="keycap"><div class="keycap-img"></div><span class="letter">N</span></div></div>
    <div class="keycap-clip" style="--i:1"><div class="keycap"><div class="keycap-img"></div><span class="letter">I</span></div></div>
    <div class="keycap-clip" style="--i:2"><div class="keycap"><div class="keycap-img"></div><span class="letter">K</span></div></div>
    <div class="keycap-clip" style="--i:3"><div class="keycap"><div class="keycap-img"></div><span class="letter">H</span></div></div>
    <div class="keycap-clip" style="--i:4"><div class="keycap"><div class="keycap-img"></div><span class="letter">C</span></div></div>
    <div class="keycap-clip" style="--i:5"><div class="keycap"><div class="keycap-img"></div><span class="letter">O</span></div></div>
    <div class="keycap-clip period" style="--i:6"><div class="keycap"><div class="keycap-img"></div><span class="letter">.</span></div></div>
  </div>
</div>
<script>
(function() {
  const CYCLE = ["#ff862a","#1e7bff","#f3cd12","#ff4499","#00f943","#cc76fd","#00c2d1"];
  const PRESS_TIME = 600;
  const STAGGER = 400;
  const END_PAUSE = 5000;
  const logo = document.getElementById('logo');
  const keycaps = logo.querySelectorAll('.keycap');
  const keycapImgs = logo.querySelectorAll('.keycap-img');
  let cycleIdx = 0;
  function setKeyColor(i, c) { keycapImgs[i].style.setProperty('--key-color', c); }
  function setAll(c) { keycapImgs.forEach(img => img.style.setProperty('--key-color', c)); }
  function doPass() {
    const next = CYCLE[(cycleIdx + 1) % CYCLE.length];
    for (let i = 0; i < keycaps.length; i++) {
      setTimeout(() => {
        const kc = keycaps[i];
        kc.classList.remove('pressing');
        void kc.offsetWidth;
        kc.classList.add('pressing');
        setTimeout(() => setKeyColor(i, next), PRESS_TIME / 2);
        setTimeout(() => kc.classList.remove('pressing'), PRESS_TIME + 10);
      }, i * STAGGER);
    }
    const total = (keycaps.length - 1) * STAGGER + PRESS_TIME + END_PAUSE;
    setTimeout(() => { cycleIdx = (cycleIdx + 1) % CYCLE.length; doPass(); }, total);
  }
  setAll(CYCLE[0]);
  setTimeout(doPass, END_PAUSE);
})();
</script>
